# Inventário de exemplo. Os grupos «windows», «linux» e «macos» são usados pelos playbooks.
[omxpatch_server]
omxpatch.exemplo.pt ansible_user=admin

[linux]
srv-linux-01.exemplo.pt ansible_user=admin
srv-linux-02.exemplo.pt ansible_user=admin

[macos]
mac-01.exemplo.pt ansible_user=admin

[windows]
pc-win-01.exemplo.pt

[windows:vars]
ansible_connection=winrm
ansible_winrm_transport=kerberos
ansible_winrm_server_cert_validation=validate
ansible_port=5986
