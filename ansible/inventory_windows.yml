---
- name: OMXPatch — inventário (Windows)
  hosts: windows
  gather_facts: true
  tasks:
    - ansible.windows.win_shell: |
        $paths = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        Get-ItemProperty $paths -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName } |
          Select-Object @{n='name';e={$_.DisplayName}}, @{n='version';e={[string]$_.DisplayVersion}}, @{n='vendor';e={$_.Publisher}} | ConvertTo-Json -Compress
      register: omx_sw
      changed_when: false
    - ansible.windows.win_shell: Get-HotFix | Select-Object -ExpandProperty HotFixID | ConvertTo-Json -Compress
      register: omx_hf
      changed_when: false
    - ansible.builtin.set_fact:
        omx_hotfixes: "{{ (omx_hf.stdout | from_json) if omx_hf.stdout | trim | length > 0 else [] }}"
    - ansible.builtin.debug:
        msg: >-
          OMXPATCH_RESULT={{ {'status': 'succeeded', 'os_name': ansible_facts.os_name, 'os_version': ansible_facts.os_version,
          'fqdn': ansible_facts.fqdn | default(''), 'ip': (ansible_facts.ip_addresses | default([''])) | first,
          'reboot_pending': false, 'hotfixes': [omx_hotfixes] if omx_hotfixes is string else omx_hotfixes,
          'software': (omx_sw.stdout | from_json) if omx_sw.stdout | trim | length > 0 else []} | to_json }}
