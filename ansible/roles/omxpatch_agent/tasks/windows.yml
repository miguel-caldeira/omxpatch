---
- name: Diretório do agente
  ansible.windows.win_file:
    path: "{{ omxpatch_agent_home_windows }}"
    state: directory

- name: Verificar se o Python já está instalado
  ansible.windows.win_stat:
    path: "{{ omxpatch_windows_python_dir }}\\python.exe"
  register: omxpatch_py

- name: Transferir o instalador do Python
  when: not omxpatch_py.stat.exists
  ansible.windows.win_get_url:
    url: "{{ omxpatch_windows_python_url }}"
    dest: "{{ omxpatch_agent_home_windows }}\\python-installer.exe"
    checksum: "{{ omxpatch_windows_python_sha256 | default(omit, true) }}"
    checksum_algorithm: sha256

- name: Instalar o Python (silencioso, para todos os utilizadores)
  when: not omxpatch_py.stat.exists
  ansible.windows.win_command: >-
    "{{ omxpatch_agent_home_windows }}\python-installer.exe" /quiet InstallAllUsers=1 PrependPath=0
    TargetDir="{{ omxpatch_windows_python_dir }}" Include_test=0

- name: Ambiente virtual
  ansible.windows.win_command: '"{{ omxpatch_windows_python_dir }}\python.exe" -m venv "{{ omxpatch_agent_home_windows }}\venv"'
  args:
    creates: "{{ omxpatch_agent_home_windows }}\\venv\\Scripts\\python.exe"

- name: Instalar o agente
  ansible.windows.win_command: >-
    "{{ omxpatch_agent_home_windows }}\venv\Scripts\python.exe" -m pip install --upgrade
    {% if omxpatch_pip_index_url %}--index-url {{ omxpatch_pip_index_url }} {% endif %}{{ omxpatch_pip_spec }}

- name: Registar o agente (uma única vez)
  ansible.windows.win_command: >-
    "{{ omxpatch_agent_home_windows }}\venv\Scripts\omxpatch-agent.exe" enroll --server {{ omxpatch_server_url }}
    --token {{ omxpatch_enrollment_token }}{% if omxpatch_pin_sha256 %} --pin-sha256 {{ omxpatch_pin_sha256 }}{% endif %}{% if omxpatch_ca_file %} --ca-file "{{ omxpatch_ca_file }}"{% endif %}
  args:
    creates: C:\ProgramData\OMXPatchAgent\agent.json
  no_log: true

- name: Tarefa agendada do agente (SYSTEM, no arranque)
  community.windows.win_scheduled_task:
    name: OMXPatchAgent
    description: OMXPatch Agent
    actions:
      - path: "{{ omxpatch_agent_home_windows }}\\venv\\Scripts\\python.exe"
        arguments: -m omxpatch_agent run
    triggers:
      - type: boot
    username: SYSTEM
    run_level: highest
    state: present
    enabled: true
    restart_count: 99
    restart_interval: PT1M
    execution_time_limit: PT0S

- name: Iniciar o agente
  community.windows.win_scheduled_task_stat:
    name: OMXPatchAgent
  register: omxpatch_task

- name: Arrancar a tarefa se não estiver em execução
  ansible.windows.win_command: schtasks /Run /TN OMXPatchAgent
  when: omxpatch_task.state.status | default('') != 'TASK_STATE_RUNNING'
  changed_when: true
