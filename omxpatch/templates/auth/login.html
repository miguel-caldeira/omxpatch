{% extends "base.html" %}{% from "_macros.html" import csrf with context %}{% block title %}Iniciar sessão{% endblock %}
{% block content %}
<div class="login panel">
  <div class="logo"><b>OMX</b>Patch</div>
  <form method="post">{{ csrf() }}
    <label for="email">E-mail</label><input type="email" id="email" name="email" required autofocus autocomplete="username">
    <label for="password">Password</label><input type="password" id="password" name="password" required autocomplete="current-password">
    <p><button class="btn" type="submit">Entrar</button></p>
  </form>
  <p class="muted small">Acesso restrito a utilizadores autorizados. Todas as ações são registadas.</p>
</div>
{% endblock %}
